[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "medialab-web"
dynamic = ["version"]
description = "Browser UI for the medialab suite; a thin client of the orchestrator gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "medialab-contracts",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "uvicorn>=0.46.0",
]

[project.scripts]
medialab-web = "medialab_web.main:main"
medialab-web-dev = "medialab_web.main:dev"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/medialab_web/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medialab_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real secrets or a live external service; skipped in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLR2004"]
# UP042: keep `(str, Enum)` rather than `StrEnum` - consistent across all
# services and the future medialab-contracts shared enums.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.uv.sources]
medialab-contracts = { git = "https://github.com/MickMarch/medialab-contracts", rev = "v1.2.0" }

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
]
