{% extends "base.html" %}
{% block title %}Search - medialab{% endblock %}
{% block nav %}
<nav>
  <a href="/">Jobs</a>
  <form method="post" action="/logout"><button class="link">Sign out</button></form>
</nav>
{% endblock %}
{% block content %}
<form class="searchbar" hx-get="/partials/search/tmdb" hx-target="#results" hx-indicator="#busy">
  <input type="search" name="query" placeholder="Movie or show title" value="{{ query }}" autofocus required>
  <button type="submit" class="primary">Search</button>
  <span id="busy" class="htmx-indicator muted">Searching...</span>
</form>
<section id="results"{% if query %} hx-get="/partials/search/tmdb?query={{ query | urlencode }}" hx-trigger="load"{% endif %}></section>
<section id="scope"></section>
<section id="torrents"></section>
<div id="download-notice" aria-live="polite"></div>
{% endblock %}
