<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}medialab{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# Error fragments arrive with 4xx/5xx; htmx 2 skips those swaps by default. #}
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}, {"code": "...", "swap": true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">medialab</a>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block footer %}{% endblock %}
</body>
</html>
