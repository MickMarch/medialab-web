{% from "partials/poster_card.html" import poster_card %}
{% if not results %}
<p class="muted">No results for "{{ query }}". Try another spelling.</p>
{% else %}
<div class="posters">
  {% for item in results %}
  {{ poster_card(item, open_vals=dict(item | card_vals, query=query), browse_href=item | browse_url) }}
  {% endfor %}
</div>
{% endif %}
