<div class="plan card">
  {% if plan.refused %}
  <p><strong>Cannot delete automatically:</strong> {{ plan.refused }}</p>
  {% else %}
  <p>Nothing has happened yet. Pressing <strong>Delete</strong> removes:</p>
  {% include "partials/plan_items.html" %}
  <button class="danger" hx-delete="/jobs/{{ job_id }}" hx-target="#{{ job_row_id_prefix }}{{ job_id }}" hx-swap="outerHTML">Delete</button>
  {% endif %}
  <button class="link" onclick="this.closest('.plan-slot').innerHTML=''">Cancel</button>
</div>
