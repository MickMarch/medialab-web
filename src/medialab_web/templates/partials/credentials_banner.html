{% if invalid %}
<div class="banner bad" role="alert">
  <strong>Credential problem.</strong>
  {% for item in invalid %}
    <span class="banner-item">{{ item.title }}{% if item.detail %} ({{ item.detail }}){% endif %}</span>
  {% endfor %}
  <span class="muted">Fix on the host: {% for item in invalid %}<code>{{ item.fix_command }}</code>{% if not loop.last %}, {% endif %}{% endfor %}</span>
</div>
{% endif %}
